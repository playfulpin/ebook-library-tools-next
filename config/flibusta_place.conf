# -----------------------------------------------------------------------------
# config/flibusta_place.conf
#
# Defaults for bin/flibusta/place_flibusta_book.sh (v0.2.0).
# Every setting resolves flag > environment variable > this file, so the
# file only needs to exist; all values may also be passed on the command
# line or exported as ROOT_LOAD / PLACE_INPUT_DIR / FLIBUSTA_DB variables.
#
# PLACE_INPUT_DIR   where stage 1 (extract_bookid_flibusta.sh) left the
#                   extracted files (matched by "<FileNumber>.*")
# ROOT_LOAD         library root: <ROOT_LOAD>/<FullName>/<seqname>/<0><seqnum> - <title>.zip
# FLIBUSTA_DB       catalog database (the 'flibusta' schema of the ml* tables)
# PLACE_REPORT_DIR  per-run TSV report directory (one row per attempted number)
# -----------------------------------------------------------------------------

PLACE_INPUT_DIR="${PLACE_INPUT_DIR:-/mnt/c/Backup_Go7/ToLoad}"
ROOT_LOAD="${ROOT_LOAD:-/mnt/c/Backup_Go7/ToLoad}"
FLIBUSTA_DB="${FLIBUSTA_DB:-flibusta}"
PLACE_REPORT_DIR="${PLACE_REPORT_DIR:-/mnt/c/Backup_Go7/merge-reports}"
