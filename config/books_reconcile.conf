# -----------------------------------------------------------------------------
# config/books_reconcile.conf
#
# Defaults for bin/books/books_reconcile.sh.  Every setting resolves
# flag > environment variable > this file > built-in default, so the file
# only needs to exist; all values may also be passed on the command line
# or exported as RECON_* / MYSQL_* / MARIA_* variables.
#
# RECON_LIBRARY_ROOT   personal-catalog root where the collected books live
#                      (flat <letter>/<author>[/series] or the nested
#                      skeleton <letter>/<prefix>/.../<author>; author
#                      folders are recognized by name at any depth)
# RECON_SCOPE_FILE     recommended-author list the collection grows toward
#                      (regenerate via bin/authors/authors_export.sh)
# RECON_REPORT_DIR     directory for the per-run TSV report
# RECON_DB             1 = pull the mlauthorname snapshot from the catalog
#                      (book counts + beyond-scope-known classification),
#                      0 = skip
# -----------------------------------------------------------------------------

RECON_LIBRARY_ROOT="${RECON_LIBRARY_ROOT:-/mnt/c/Backup_Go7/Books}"
RECON_SCOPE_FILE="${RECON_SCOPE_FILE:-$PROJECT_ROOT/data/fixtures/authors_list_from_db.txt}"
RECON_REPORT_DIR="${RECON_REPORT_DIR:-/mnt/c/Backup_Go7/merge-reports}"
RECON_DB="${RECON_DB:-1}"
