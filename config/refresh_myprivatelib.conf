# -----------------------------------------------------------------------------
# config/refresh_myprivatelib.conf
#
# Defaults for bin/refresh_myprivatelib.sh.  Every setting resolves
# flag > environment variable > this file > built-in default, so the file
# only needs to exist; all values may also be passed on the command line
# or exported as REFRESH_* / MYSQL_* variables.
#
# REFRESH_LIBRARY_ROOT  the Books tree to watch for changes.  KEEP IN SYNC
#                       with POP_LIBRARY_ROOT (config/populate_myprivatelib.conf):
#                       the checkpoint fingerprints THIS tree, and populate
#                       rebuilds from POP_LIBRARY_ROOT - they must be the
#                       same collection.
# REFRESH_REPORT_DIR    where the checkpoint and the reports live (same dir
#                       as the populate reports, so the run history sits
#                       together)
# REFRESH_CHECKPOINT    checkpoint file name inside REFRESH_REPORT_DIR
# REFRESH_MYSQL_ARGS    forwarded to the child tools as extra CLI args
#                       (e.g. "--debug"); MYSQL_* env vars pass through
#                       untouched
# -----------------------------------------------------------------------------

REFRESH_LIBRARY_ROOT="${REFRESH_LIBRARY_ROOT:-/mnt/c/Backup_Go7/Books}"
REFRESH_REPORT_DIR="${REFRESH_REPORT_DIR:-/mnt/c/Backup_Go7/merge-reports}"
REFRESH_CHECKPOINT="${REFRESH_CHECKPOINT:-refresh_checkpoint.tsv}"
REFRESH_MYSQL_ARGS="${REFRESH_MYSQL_ARGS:-}"
