# config/books_merge.conf
#
# Configuration for bin/books/books_merge.sh (v0.2.1).
#
# Every setting resolves:  command-line flag > environment variable >
# config file > built-in default.  The same keys work as environment
# variables, e.g.  MERGE_INPUT_FILE=... ./bin/books/books_merge.sh
#
# --dry-run is intentionally NOT configurable: it stays a command-line
# safety gate so a real copy can never silently become a dry run.

# Flat author list (one canonical name per line); the source of truth for
# the prefix tree.  The tree is built in memory -- no Empty_Skeleton folder
# is created or consumed any more.
MERGE_INPUT_FILE="/mnt/c/git_root/ebook-library-tools-next/data/fixtures/authors_list_from_db.txt"

# Archive root whose top-level folders are authors (required).
MERGE_SOURCE_DIR="/mnt/c/Backup_Go7/ToLoad"

# Parent directory for the timestamped, pruned staging tree.  Books are
# written into <MERGE_OUTPUT_DIR>/BooksInput_<timestamp>, which the
# finalize step (bin/books_finalize.sh) then rsyncs into Books.
MERGE_OUTPUT_DIR="/mnt/c/Backup_Go7"

# Where the TSV reports are written (manifest, unmatched, ambiguous,
# collisions, duplicates, skipped-files).
MERGE_REPORT_DIR="/mnt/c/Backup_Go7/merge-reports"

# Minimum authors sharing a prefix for it to become a directory level.
MERGE_MIN_AUTHORS=10

# Deepest prefix level to consider (characters).
MERGE_MAX_PREFIX=5

# Copy book-series subfolders recursively (ON) or only direct files (OFF).
# Empty subfolders are never created either way.
MERGE_RECURSIVE="ON"

# What to do when the destination file already exists:
#   never  - skip it (safest; the default)
#   ask    - prompt per file; non-interactive runs behave like 'never'
#   force  - overwrite it
MERGE_OVERWRITE="never"

# Space-separated basenames that are never copied (Windows metadata).
# Files with these exact names, in any folder, are skipped entirely.
# Add any other metadata filenames you want to keep out of the library.
MERGE_SKIP_NAMES="desktop.ini Thumbs.db"