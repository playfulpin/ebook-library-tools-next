# -----------------------------------------------------------------------------
# config/flibusta_extract.conf
#
# Defaults for bin/flibusta/the extractor family (extract_bookid/author/series_flibusta.sh).
# Every setting resolves flag > environment variable > this file, so the
# file only needs to exist; all values may also be passed on the command
# line or exported as FLIBUSTA_* variables.
#
# FLIBUSTA_SOURCE_DIR   root holding the Flibusta range archives
#                       (f.fb2-START-END.zip; later also f.usr-*)
# FB2_OUTPUT_DIR        where the extracted <FileNumber>.fb2 is written
# -----------------------------------------------------------------------------

FLIBUSTA_SOURCE_DIR="${FLIBUSTA_SOURCE_DIR:-/mnt/x/flibusta}"
FB2_OUTPUT_DIR="${FB2_OUTPUT_DIR:-/mnt/c/Backup_Go7/ToLoad}"
