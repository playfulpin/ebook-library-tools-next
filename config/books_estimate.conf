# -----------------------------------------------------------------------------
# config/books_estimate.conf
#
# Defaults for bin/books/books_estimate.sh.  Every setting resolves
# flag > environment variable > this file > built-in default, so the file
# only needs to exist; all values may also be passed on the command line
# or exported as ESTIMATE_* / MYSQL_* / MARIA_* variables.
#
# ESTIMATE_INPUT_FILE   to-collect author list (one canonical name per line;
#                       e.g. the books_reconcile.sh shopping-list export
#                       reconcile_to_collect_<ts>.txt, or the recommended-
#                       author fixture regenerated by bin/authors/authors_export.sh)
# ESTIMATE_REPORT_DIR   directory for the per-author breakdown TSV
# -----------------------------------------------------------------------------

ESTIMATE_INPUT_FILE="${ESTIMATE_INPUT_FILE:-$PROJECT_ROOT/data/fixtures/authors_list_from_db.txt}"
ESTIMATE_REPORT_DIR="${ESTIMATE_REPORT_DIR:-/mnt/c/Backup_Go7/merge-reports}"