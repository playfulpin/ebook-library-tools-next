# -----------------------------------------------------------------------------
# config/backup_myprivatelib.conf
#
# Defaults for bin/backup_myprivatelib.sh.  Every setting resolves
# flag > environment variable > this file > built-in default, so the file
# only needs to exist; all values may also be passed on the command line
# or exported as BACKUP_* / MYSQL_* / MARIA_* variables.
#
# BACKUP_DIR          where backups live (created on demand)
# BACKUP_DB           the library database to back up (the app-registered
#                     sibling library; same 17-table schema as flibusta)
# BACKUP_KEEP         keep only the N newest backups; 0 = keep all
# -----------------------------------------------------------------------------

BACKUP_DIR="${BACKUP_DIR:-/mnt/c/Backup_Go7/myprivatelib-backups}"
BACKUP_DB="${BACKUP_DB:-myprivatelib}"
BACKUP_KEEP="${BACKUP_KEEP:-0}"