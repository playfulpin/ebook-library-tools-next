# -----------------------------------------------------------------------------
# config/populate_myprivatelib.conf
#
# Defaults for bin/populate_myprivatelib.sh.  Every setting resolves
# flag > environment variable > this file > built-in default, so the file
# only needs to exist; all values may also be passed on the command line
# or exported as POP_* / MYSQL_* / MARIA_* variables.
#
# POP_LIBRARY_ROOT   the personal Books tree to scan (books live here as
#                    zip-wrapped FB2 or loose *.fb2)
# POP_REPORT_DIR     where the per-run TSV report goes
# POP_SOURCE_DB      read-only catalog DB (md5 map + catalog rows come from
#                    here; NEVER written)
# POP_TARGET_DB      the library DB to rebuild (the app-registered sibling
#                    library created in MultiLib.exe with the Flibusta plugin)
# POP_CHUNK          bookids per catalog read IN-list (query-size bound);
#                    the rebuild itself is one row-by-row SQL script in a
#                    single session
# -----------------------------------------------------------------------------

POP_LIBRARY_ROOT="${POP_LIBRARY_ROOT:-/mnt/c/Backup_Go7/Books}"
POP_REPORT_DIR="${POP_REPORT_DIR:-/mnt/c/Backup_Go7/merge-reports}"
POP_SOURCE_DB="${POP_SOURCE_DB:-flibusta}"
POP_TARGET_DB="${POP_TARGET_DB:-myprivatelib}"
POP_CHUNK="${POP_CHUNK:-500}"