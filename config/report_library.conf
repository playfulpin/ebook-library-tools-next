# -----------------------------------------------------------------------------
# config/report_library.conf
#
# Version:       1.0.0
# Last updated:  2026-09-06 23:30
#
# Configuration for bin/report_library.sh (v1.0.0) - the personal-library
# wish list (reading plan) and reporting view.
#
# Every setting can be overridden by the environment: the tool reads the
# config first, then the environment wins (REPORT_* variables).  The MariaDB
# connection itself uses the shared MYSQL_* contract (see
# lib/mariadb_lifecycle.sh), same as BookTracker-import.
# -----------------------------------------------------------------------------

# Wish-list store: a plain TSV file, one entry per line:
#   bookid <TAB> added <TAB> target_period <TAB> status <TAB> note
# Kept OUT of the database on purpose - it survives the populate
# TRUNCATE-reload cycle untouched and diffs cleanly in git.
REPORT_WISHLIST_FILE="${REPORT_WISHLIST_FILE:-$PROJECT_ROOT/data/wishlist.tsv}"

# Where --export writes report_wishlist_<ts>.md / .tsv
REPORT_OUTPUT_DIR="${REPORT_OUTPUT_DIR:-/mnt/c/Backup_Go7/merge-reports}"

# Read-only catalog join target (the populated personal library)
REPORT_TARGET_DB="${REPORT_TARGET_DB:-myprivatelib}"

# Allowed statuses (space-separated); the tool validates against this list
REPORT_STATUSES="${REPORT_STATUSES:-wish reading done}"
