name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install test dependencies (gawk, rsync, pv)
        run: sudo apt-get update && sudo apt-get install -y gawk rsync pv

      - name: Shell syntax check
        run: |
          set -e
          for f in bin/*.sh bin/*/*.sh lib/*.sh lib/*.awk; do
            [[ -f "$f" ]] || continue
            case "$f" in
              *.sh) bash -n "$f" ;;
              *.awk) gawk --lint --source 'BEGIN{}' -f "$f" >/dev/null ;;
            esac
            echo "ok: $f"
          done

      - name: Version sync check
        run: bash tests/test_version_sync.sh

      - name: Unit suites (run anywhere)
        run: |
          bash tests/test_books_merge.sh
          bash tests/test_books_finalize.sh
          bash tests/test_authors_export.sh
          bash tests/test_books_reconcile.sh
          bash tests/test_books_estimate.sh
          bash tests/test_library_backup.sh
          bash tests/test_library_populate.sh
          bash tests/test_library_refresh.sh
          bash tests/test_report_library.sh
          bash tests/test_lib_infrastructure.sh

      - name: UTF-8 suites (WSL-style, multibyte bash)
        run: |
          bash tests/test_authors_tree_build.sh
          bash tests/test_authors_prefix_build.sh
          bash tests/test_authors_prefix_tree.sh
          bash tests/test_utf8_prefix_generator.sh
          bash tests/test_e2e_pipeline.sh