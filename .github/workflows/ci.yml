name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install test dependencies (gawk, rsync, pv, zip, unzip)
        run: sudo apt-get update && sudo apt-get install -y gawk rsync pv zip unzip

      - name: Shell syntax check
        run: |
          set -e
          for f in bin/*.sh bin/*/*.sh lib/*.sh lib/*.awk tests/run_all.sh; do
            [[ -f "$f" ]] || continue
            case "$f" in
              *.sh) bash -n "$f" ;;
              *.awk) gawk --lint --source 'BEGIN{}' -f "$f" >/dev/null ;;
            esac
            echo "ok: $f"
          done

      - name: Layer boundary check (Follow-It §4)
        run: bin/check_layers.sh

      - name: Version sync check
        run: bash tests/unit/test_version_sync.sh

      - name: Unit suites
        run: tests/run_all.sh unit

      - name: Integration suites (UTF-8, multibyte bash)
        run: tests/run_all.sh integration

      - name: E2E suite (real fixture data)
        run: tests/run_all.sh e2e
